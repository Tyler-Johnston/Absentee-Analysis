<svg width="1600" height="820" viewBox="0 0 1600 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="paperGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#12304A" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0C2032" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- A cool, paper-like field report rather than a dashboard surface -->
  <rect width="1600" height="820" fill="#C8DCE3"/>
  <rect width="1600" height="820" fill="url(#paperGrid)"/>
  <rect x="0" y="0" width="32" height="820" fill="#12304A"/>

  <!-- Title block -->
  <text x="94" y="136" fill="#12304A" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="-2">Absenteeism</text>
  <text x="94" y="205" fill="#12304A" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="-2">analysis</text>
  <path d="M97 239H431" stroke="#12304A" stroke-width="5"/>
  <text x="96" y="285" fill="#31566D" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0.7">AVERAGE ABSENCE BY EMPLOYEE PROFILE</text>

  <!-- Proper bar-chart frame: 0–9 hours in 3-hour intervals -->
  <text x="562" y="365" fill="#31566D" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="0.7">HOURS</text>
  <line x1="640" y1="390" x2="640" y2="665" stroke="#12304A" stroke-width="3"/>
  <line x1="640" y1="390" x2="1490" y2="390" stroke="#12304A" stroke-opacity="0.20" stroke-width="2"/>
  <line x1="640" y1="481.7" x2="1490" y2="481.7" stroke="#12304A" stroke-opacity="0.16" stroke-width="2"/>
  <line x1="640" y1="573.3" x2="1490" y2="573.3" stroke="#12304A" stroke-opacity="0.16" stroke-width="2"/>
  <line x1="640" y1="665" x2="1490" y2="665" stroke="#12304A" stroke-width="3"/>
  <text x="612" y="397" fill="#31566D" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end">9</text>
  <text x="612" y="489" fill="#31566D" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end">6</text>
  <text x="612" y="580" fill="#31566D" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end">3</text>
  <text x="612" y="672" fill="#31566D" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end">0</text>

  <!-- Three employee-profile bars; the high-absence profile is the focal point -->
  <g filter="url(#softShadow)">
    <rect x="705" y="500" width="170" height="165" fill="#6FA8C9"/>
    <rect x="975" y="406.5" width="170" height="258.5" fill="#0C2032"/>
    <rect x="1245" y="449.9" width="170" height="215.1" fill="#12304A"/>
  </g>
  <text x="790" y="474" fill="#12304A" font-family="Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">5.40h</text>
  <text x="1060" y="376" fill="#12304A" font-family="Arial, sans-serif" font-size="56" font-weight="800" text-anchor="middle">8.46h</text>
  <text x="1330" y="425" fill="#12304A" font-family="Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">7.04h</text>

  <!-- Profile names use a shared baseline rather than separate cards -->
  <text x="705" y="715" fill="#12304A" font-family="Arial, sans-serif" font-size="22" font-weight="700">LONG-DISTANCE</text>
  <text x="705" y="744" fill="#12304A" font-family="Arial, sans-serif" font-size="22" font-weight="700">COMMUTERS</text>

  <text x="975" y="715" fill="#12304A" font-family="Arial, sans-serif" font-size="22" font-weight="700">EXPERIENCED</text>
  <text x="975" y="744" fill="#12304A" font-family="Arial, sans-serif" font-size="22" font-weight="700">URBAN WORKERS</text>

  <text x="1245" y="715" fill="#12304A" font-family="Arial, sans-serif" font-size="22" font-weight="700">YOUNG FAMILY-</text>
  <text x="1245" y="744" fill="#12304A" font-family="Arial, sans-serif" font-size="22" font-weight="700">ORIENTED</text>

</svg>
